<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — P Fanthoms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23FF5E2C'/%3E%3Crect x='9' y='12.5' width='17' height='11.5' rx='1.6' fill='%23fff'/%3E%3Cpath d='M26 15.5 H31.5 C32.6 15.5 33.5 16.4 33.5 17.5 V21.5 C33.5 22.6 32.6 23.5 31.5 23.5 H26 V15.5 Z' fill='%23fff'/%3E%3Crect x='27.4' y='17' width='4.4' height='3.6' rx='0.8' fill='%23131E36'/%3E%3Ccircle cx='14.5' cy='25.3' r='3.3' fill='%23131E36'/%3E%3Ccircle cx='28' cy='25.3' r='3.3' fill='%23131E36'/%3E%3C/svg%3E">
<style>
  :root{
    --navy:#131E36; --navy-2:#1C2B4D; --orange:#FF5E2C; --orange-dark:#E44A1B;
    --yellow:#FFC23C; --sand:#FBF5EC; --green:#1E8F5F; --red:#D64545; --ink:#181818; --paper:#FFFFFF; --line:rgba(19,30,54,0.12);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Space Grotesk', sans-serif; background:var(--sand); color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2{ font-family:'Archivo Black', sans-serif; line-height:1.05; margin:0; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:460px; margin:0 auto; padding:0 24px; }
  button{ font-family:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }

  header{ background:var(--navy); border-bottom:3px solid var(--orange); padding:16px 0; }
  .head-row{ display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; padding:0 24px; }
  .logo{ display:flex; align-items:center; gap:10px; color:#fff; font-family:'Archivo Black',sans-serif; font-size:19px; }
  .back-link{ color:rgba(255,255,255,0.7); font-size:14px; }
  .back-link:hover{ color:#fff; }

  main{ padding:56px 0 80px; }
  .card{ background:#fff; border-radius:22px; padding:36px 32px; box-shadow:0 20px 50px rgba(19,30,54,0.08); border:1px solid var(--line); }
  .card h1{ font-size:28px; color:var(--navy); margin-bottom:6px; }
  .card .sub{ font-size:14.5px; color:#777; margin-bottom:26px; }

  .tabs{ display:flex; background:var(--sand); border-radius:12px; padding:4px; margin-bottom:28px; }
  .tab{ flex:1; text-align:center; padding:11px; border-radius:9px; font-size:14.5px; font-weight:600; color:#777; cursor:pointer; }
  .tab.active{ background:var(--navy); color:#fff; }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:7px; }
  .field input{ width:100%; padding:13px 15px; border-radius:11px; border:1.5px solid var(--line); font-size:15px; font-family:inherit; background:#fff; }
  .field input:focus{ outline:none; border-color:var(--orange); }

  .role-row{ display:flex; gap:10px; margin-bottom:22px; }
  .role-chip{ flex:1; text-align:center; padding:14px 10px; border-radius:12px; border:2px solid var(--line); cursor:pointer; font-size:14px; font-weight:600; color:#666; }
  .role-chip .ic{ font-size:22px; display:block; margin-bottom:6px; }
  .role-chip.selected{ border-color:var(--orange); background:#FFF4EE; color:var(--navy); }

  .btn{ width:100%; display:flex; align-items:center; justify-content:center; padding:14px; border-radius:11px; font-weight:600; font-size:15.5px; border:none; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .btn-primary{ background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-dark); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 6px 0 var(--orange-dark); }
  .btn-primary:disabled{ background:#ddd; box-shadow:none; cursor:not-allowed; transform:none; color:#999; }
  .btn-ghost{ width:100%; padding:14px; border-radius:11px; border:1.5px solid var(--line); background:#fff; color:var(--navy); font-weight:600; font-size:15px; cursor:pointer; }
  .btn-ghost:hover{ border-color:var(--navy); }

  .msg{ font-size:13.5px; padding:12px 14px; border-radius:10px; margin-bottom:18px; display:none; }
  .msg.show{ display:block; }
  .msg.error{ background:#FCE9E9; color:var(--red); }
  .msg.success{ background:#E6F5EE; color:var(--green); }

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* account view once logged in */
  .account-head{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .avatar{ width:52px; height:52px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Archivo Black',sans-serif; font-size:18px; flex-shrink:0; }
  .account-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:var(--navy); }
  .role-badge{ display:inline-block; margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:3px 10px; border-radius:100px; background:var(--yellow); color:var(--navy); font-weight:600; }
  .account-row{ display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .account-row .k{ color:#888; }
  .account-row .v{ font-weight:600; color:var(--navy); }

  .switch-link{ text-align:center; margin-top:18px; font-size:14px; color:#777; }
  .switch-link a{ color:var(--orange-dark); font-weight:600; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <a href="index.html" class="logo">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#FF5E2C"/>
        <rect x="9" y="12.5" width="17" height="11.5" rx="1.6" fill="#fff"/>
        <path d="M26 15.5 H31.5 C32.6 15.5 33.5 16.4 33.5 17.5 V21.5 C33.5 22.6 32.6 23.5 31.5 23.5 H26 V15.5 Z" fill="#fff"/>
        <rect x="27.4" y="17" width="4.4" height="3.6" rx="0.8" fill="#131E36"/>
        <circle cx="14.5" cy="25.3" r="3.3" fill="#131E36"/><circle cx="14.5" cy="25.3" r="1.2" fill="#fff"/>
        <circle cx="28" cy="25.3" r="3.3" fill="#131E36"/><circle cx="28" cy="25.3" r="1.2" fill="#fff"/>
      </svg>
      P FANTHOMS
    </a>
    <a href="index.html" class="back-link">← Back to site</a>
  </div>
</header>

<main class="wrap">
  <div class="card">

    <!-- LOGGED OUT: sign in / sign up -->
    <div id="auth-view">
      <h1>Welcome</h1>
      <p class="sub">Log in to track your deliveries or manage your jobs.</p>

      <div class="tabs">
        <div class="tab active" id="tab-signin">Log in</div>
        <div class="tab" id="tab-signup">Sign up</div>
      </div>

      <div class="msg" id="auth-msg"></div>

      <!-- SIGN IN -->
      <div class="panel active" id="panel-signin">
        <div class="field">
          <label>Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="signin-btn">Log in</button>
        <p class="switch-link">Don't have an account? <a href="#" id="go-signup">Sign up</a></p>
      </div>

      <!-- SIGN UP -->
      <div class="panel" id="panel-signup">
        <div class="field">
          <label>Full name</label>
          <input type="text" id="signup-name" placeholder="Jane Smith" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label>I'm signing up as a...</label>
          <div class="role-row">
            <div class="role-chip selected" data-role="customer"><span class="ic">📦</span>Customer</div>
            <div class="role-chip" data-role="courier"><span class="ic">🚐</span>Courier</div>
          </div>
        </div>
        <button class="btn btn-primary" id="signup-btn">Create account</button>
        <p class="switch-link">Already have an account? <a href="#" id="go-signin">Log in</a></p>
      </div>
    </div>

    <!-- LOGGED IN -->
    <div class="panel" id="account-view">
      <div class="account-head">
        <div class="avatar" id="account-initials">–</div>
        <div>
          <div class="account-name" id="account-name">–</div>
          <span class="role-badge" id="account-role">–</span>
        </div>
      </div>
      <div class="account-row"><span class="k">Email</span><span class="v" id="account-email">–</span></div>
      <div class="account-row"><span class="k">Member since</span><span class="v" id="account-since">–</span></div>
      <div style="margin-top:26px;">
        <button class="btn-ghost" id="signout-btn">Sign out</button>
      </div>
    </div>

  </div>
</main>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const supabase = createClient(
    'https://urdhtrsxbetijzaxlhxu.supabase.co',
    'sb_publishable_dgxPA7kUrbNbk9q25qA0lA_Xb0n83_D'
  );

  const authView = document.getElementById('auth-view');
  const accountView = document.getElementById('account-view');
  const msg = document.getElementById('auth-msg');

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'msg show ' + type;
  }
  function clearMessage(){
    msg.className = 'msg';
  }

  // tab switching
  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const panelSignin = document.getElementById('panel-signin');
  const panelSignup = document.getElementById('panel-signup');

  function showSignin(){
    tabSignin.classList.add('active'); tabSignup.classList.remove('active');
    panelSignin.classList.add('active'); panelSignup.classList.remove('active');
    clearMessage();
  }
  function showSignup(){
    tabSignup.classList.add('active'); tabSignin.classList.remove('active');
    panelSignup.classList.add('active'); panelSignin.classList.remove('active');
    clearMessage();
  }
  tabSignin.addEventListener('click', showSignin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('go-signup').addEventListener('click', (e) => { e.preventDefault(); showSignup(); });
  document.getElementById('go-signin').addEventListener('click', (e) => { e.preventDefault(); showSignin(); });

  // role chip selection
  let selectedRole = 'customer';
  document.querySelectorAll('.role-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedRole = chip.dataset.role;
    });
  });

  // SIGN UP
  document.getElementById('signup-btn').addEventListener('click', async () => {
    clearMessage();
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;

    if (!name || !email || !password) {
      showMessage('Please fill in every field.', 'error');
      return;
    }
    if (password.length < 6) {
      showMessage('Password must be at least 6 characters.', 'error');
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: { data: { full_name: name, role: selectedRole } }
    });

    if (error) {
      showMessage(error.message, 'error');
      return;
    }
    showMessage('Account created! Check your email to confirm, then sign in.', 'success');
    showSignin();
  });

  // SIGN IN
  document.getElementById('signin-btn').addEventListener('click', async () => {
    clearMessage();
    const email = document.getElementById('signin-email').value.trim();
    const password = document.getElementById('signin-password').value;

    if (!email || !password) {
      showMessage('Please enter your email and password.', 'error');
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      showMessage(error.message, 'error');
      return;
    }
    renderAccount(data.user);
  });

  // SIGN OUT
  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    authView.style.display = 'block';
    accountView.classList.remove('active');
    showSignin();
  });

  function renderAccount(user){
    const name = (user.user_metadata && user.user_metadata.full_name) || user.email;
    const role = (user.user_metadata && user.user_metadata.role) || 'customer';
    const initials = name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    const since = new Date(user.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });

    document.getElementById('account-initials').textContent = initials;
    document.getElementById('account-name').textContent = name;
    document.getElementById('account-role').textContent = role === 'courier' ? '🚐 Courier account' : '📦 Customer account';
    document.getElementById('account-email').textContent = user.email;
    document.getElementById('account-since').textContent = since;

    authView.style.display = 'none';
    accountView.classList.add('active');
  }

  // check if already logged in on page load
  supabase.auth.getSession().then(({ data }) => {
    if (data.session && data.session.user) {
      renderAccount(data.session.user);
    }
  });
</script>

</body>
</html>
